[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "babblet"
version = "0.1.0"
description = "Offline multilingual speech translation deck"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["faster-whisper>=1.2,<2", "av==16.0.1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "numpy>=2,<2.5", "sounddevice>=0.5,<1", "soundfile>=0.13,<1", "huggingface-hub>=0.36,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
benchmark = ["transformers==4.57.3", "tokenizers==0.22.2", "torch==2.9.1", "sentencepiece>=0.2,<1", "sacrebleu>=2.5,<3"]
fixtures = ["edge-tts==7.3.1", "pywin32>=308; sys_platform == 'win32'"]
tablet-dev = ["PySide6-Essentials==6.8.3", "fonttools>=4.60,<5"]
desktop = ["PySide6-Essentials==6.8.3"]

[project.gui-scripts]
babblet-desktop = "babblet.desktop:main"

[project.scripts]
babblet = "babblet.cli:main"

[tool.setuptools]
packages = ["babblet"]

[tool.setuptools.package-data]
babblet = ["static/*", "static/flags/*", "static/art/*"]
