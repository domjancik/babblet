<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Babblet · Live translation</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body data-view="slots">
<header class="toolbar"><a class="brand" href="/">babblet<span class="live-dot" aria-hidden="true"></span></a><p id="status" role="status">Connecting…</p><div id="mic-level" class="mic-level" data-state="inactive" title="Microphone input level"><span class="mic-label">Mic</span><div id="mic-level-meter" role="meter" aria-label="Microphone input level" aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-60"><span id="mic-level-fill"></span></div><span id="mic-level-text">No input</span></div><nav aria-label="Display controls"><div class="view-toggle" role="group" aria-label="View"><button id="clean-view" type="button" aria-pressed="false" title="FIFO slots with ink and hidden controls">Clean</button><button id="slots-view" type="button" aria-pressed="true" title="FIFO: replace only the oldest row; keep every other row">Slots</button><button id="list-view" type="button" aria-pressed="false">List</button></div><label id="slot-setting" hidden>Slots <select id="slot-count" aria-label="Slots per column"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6" selected>6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></label><button id="ink-toggle" type="button" aria-pressed="true">Ink</button><button id="open-languages" type="button">Languages <span id="language-count">3</span></button><button id="open-inspector" type="button">Inspect</button></nav></header>
<button id="show-controls" type="button" aria-label="Show translation controls" title="Show controls (Esc)">Controls</button><main id="utterances" aria-label="Live multilingual conversation" aria-live="polite"><p class="empty">Listening for a conversation…</p></main>
<dialog id="language-dialog" aria-labelledby="language-title"><form id="language-form"><div class="dialog-heading"><div><h1 id="language-title">Conversation languages</h1><p id="language-description">Select up to six languages to display.</p></div><button id="close-languages" type="button" aria-label="Close language selection">×</button></div><div class="language-tabs" role="tablist" aria-label="Language settings"><button id="display-languages-tab" role="tab" aria-selected="true" type="button">Display</button><button id="speech-languages-tab" role="tab" aria-selected="false" type="button">Expected speech</button></div><button id="speech-sync" type="button" aria-pressed="true">Read and hear the same languages</button><div id="speech-suggestions" aria-live="polite"></div><div id="speech-auto" hidden><button id="automatic-speech" type="button">Use automatic detection</button></div><label class="search-label" for="language-search">Find a language</label><input id="language-search" type="search" placeholder="Search languages…" autocomplete="off"><div id="language-options"></div><p id="language-error" role="alert"></p><footer><span id="selection-count"></span><span id="language-save-status" role="status"></span></footer></form></dialog>
<dialog id="recognition-dialog" aria-labelledby="recognition-title"><div class="dialog-heading"><div><h1 id="recognition-title">Speech recognition inspector</h1><p>Latest result only · held in memory for up to 60 seconds · no audio recording</p></div><button id="close-inspector" type="button" aria-label="Close recognition inspector">×</button></div><div id="recognition-body"></div></dialog></body></html>
